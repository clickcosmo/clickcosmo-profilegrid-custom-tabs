name: Publish v0.1.1
# One-time release publisher.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag v0.1.1
        shell: bash
        run: |
          git tag -f v0.1.1 "${GITHUB_SHA}"
          git push origin refs/tags/v0.1.1 --force

      - name: Build installable plugin ZIP
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/cc-profilegrid-custom-tabs
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            ./ dist/cc-profilegrid-custom-tabs/
          cd dist
          zip -rq "../cc-profilegrid-custom-tabs-0.1.1.zip" cc-profilegrid-custom-tabs

      - name: Publish v0.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 cc-profilegrid-custom-tabs-0.1.1.zip --clobber
            gh release edit v0.1.1 --title v0.1.1
          else
            gh release create v0.1.1 cc-profilegrid-custom-tabs-0.1.1.zip --title v0.1.1 --generate-notes
          fi
